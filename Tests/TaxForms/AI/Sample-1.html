<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fictitious Form Layout</title>
  <style>
	* {
	  box-sizing: border-box;
	  font-family: Arial, Helvetica, sans-serif;
	}

	body {
	  background-color: #f4f4f9;
	  padding: 20px;
	  margin: 0;
	}

	.form-container {
	  width: 800px;
	  margin: 0 auto;
	  background: #ffffff;
	  border: 2px solid #333333;
	  padding: 16px;
	  display: flex;
	  flex-direction: column;
	  gap: 12px;
	}

	/* Header Across Top */
	.form-header {
	  background-color: #2c3e50;
	  color: #ffffff;
	  padding: 12px 16px;
	  border-radius: 4px;
	  display: flex;
	  justify-content: space-between;
	  align-items: center;
	}

	.form-header h1 {
	  margin: 0;
	  font-size: 20px;
	  text-transform: uppercase;
	  letter-spacing: 1px;
	}

	.form-header span {
	  font-size: 12px;
	  opacity: 0.8;
	}

	/* Common Field Box Styles */
	.field-box {
	  border: 1px solid #b0b0b0;
	  border-radius: 4px;
	  padding: 8px 10px;
	  background-color: #fafafa;
	}

	.field-label {
	  font-size: 10px;
	  font-weight: bold;
	  text-transform: uppercase;
	  color: #555555;
	  display: block;
	  margin-bottom: 4px;
	}

	.field-value {
	  font-size: 13px;
	  font-weight: bold;
	  color: #111111;
	}

	/* Row 1: 2/3 and 1/3 split */
	.row-1 {
	  display: grid;
	  grid-template-columns: 2fr 1fr;
	  gap: 12px;
	}

	/* Row 2: 3 equal items (1/3 each) */
	.row-2 {
	  display: grid;
	  grid-template-columns: repeat(3, 1fr);
	  gap: 12px;
	}

	@media print {
	  body { background: none; padding: 0; }
	  .form-container { border: 1px solid #000; width: 100%; }
	}
  </style>
</head>
<body>

<div class="form-container">
  <!-- Header Across the Top -->
  <header class="form-header">
	<h1>Account Summary Form</h1>
	<span>FORM ID: X-2026</span>
  </header>

  <!-- Row 1: First item takes 2/3, second takes 1/3 -->
  <div class="row-1">
	<div class="field-box">
	  <span class="field-label">Primary Account Holder Name (2/3 Width)</span>
	  <div class="field-value">ACME CORPORATION ENTERPRISES LLC</div>
	</div>
	<div class="field-box">
	  <span class="field-label">Account Number (1/3 Width)</span>
	  <div class="field-value">AC-987654321</div>
	</div>
  </div>

  <!-- Row 2: Three equally sized items -->
  <div class="row-2">
	<div class="field-box">
	  <span class="field-label">Billing Region</span>
	  <div class="field-value">WEST COAST</div>
	</div>
	<div class="field-box">
	  <span class="field-label">Effective Date</span>
	  <div class="field-value">08/25/2026</div>
	</div>
	<div class="field-box">
	  <span class="field-label">Current Balance</span>
	  <div class="field-value">$12,450.00</div>
	</div>
  </div>
</div>

</body>
</html>
