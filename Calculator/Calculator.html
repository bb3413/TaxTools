<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />

	<link rel="stylesheet" href="../Library/TaxTools/TaxTools.css" />
	<link rel="stylesheet" href="Calculator.css" />

	<script type="module" src="../Library/EvalExpression.js"></script>
	<script type="module" src="Calculator.js"></script>

	<title>Simple Math Calculator</title>
</head>

<body>
	<div class="tool-container">
		<input type="text" id="display" class="display" value="0" autofocus inputmode="none" autocomplete="off" />
		
		<div class="buttons">
			<button data-action="clear">CLR</button>
			<button data-action="delete">DEL</button>
			<button data-val="(">(</button>
			<button data-val=")">)</button>
			
			<button data-val="7">7</button>
			<button data-val="8">8</button>
			<button data-val="9">9</button>
			<button data-val="/" class="operator">/</button>

			<button data-val="4">4</button>
			<button data-val="5">5</button>
			<button data-val="6">6</button>
			<button data-val="*" class="operator">*</button>

			<button data-val="1">1</button>
			<button data-val="2">2</button>
			<button data-val="3">3</button>
			<button data-val="-" class="operator">−</button>

			<button data-val="0">0</button>
			<button data-val=".">.</button>
			<button data-action="calculate" class="operator">=</button>
			<button data-val="+" class="operator">+</button>
		</div>
	</div>
</body>
</html>
